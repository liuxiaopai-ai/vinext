name: "Next.js tip"

on:
  workflow_dispatch: # disabled schedule — re-enable once ecosystem tests are stable

permissions:
  contents: read

concurrency:
  group: tip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-repos:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.read.outputs.repos }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "repos=$(jq -c . .github/repos.json)" >> "$GITHUB_OUTPUT"

  test:
    name: "${{ matrix.repo.name }} (next@canary)"
    needs: load-repos
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.load-repos.outputs.repos) }}
    uses: ./.github/workflows/ecosystem-run.yml
    with:
      repo_url: ${{ matrix.repo.url }}
      next_version: "canary"

  # NOTE: In forks, the secrets context may be unavailable at workflow-parse time,
  # causing this workflow file to be marked invalid on every push (and spam failure emails).
  # Upstream has its own failure notification; forks can omit it safely.
